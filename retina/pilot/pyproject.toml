[project]
name = "retina-pilot"
version = "0.1.0"
description = "10-geography retina access and evidence action pilot (wet AMD)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "duckdb>=1.0",
    "requests>=2.32",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retina_pilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
